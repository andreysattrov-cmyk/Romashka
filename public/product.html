<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Букет — Ромашка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .product-page{padding:65px 7vw 100px;background:var(--cream);min-height:calc(100vh - 116px)}
    .back{display:inline-flex;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:45px}
    .detail{display:grid;grid-template-columns:1.03fr .97fr;gap:7vw;align-items:center}
    .detail-photo{aspect-ratio:.9;overflow:hidden;background:#e8e7df;box-shadow:var(--shadow)}
    .detail-photo img{height:100%;object-fit:cover}
    .detail-copy h1{font-family:'Playfair Display';font-size:clamp(46px,5vw,72px);line-height:1;margin:16px 0}
    .detail-price{font-size:21px;font-weight:700;margin:20px 0 28px}
    .detail-description{color:var(--muted);font-size:15px;line-height:1.9;max-width:560px}
    .detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:35px 0;background:var(--line);border:1px solid var(--line)}
    .meta{background:var(--paper);padding:18px}
    .meta span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#888f87;margin-bottom:7px}
    .meta b{font-size:13px}
    .order{display:flex;gap:12px;flex-wrap:wrap}
    .order .btn{min-width:230px}
    .detail-note{margin-top:20px;color:#8a9189;font-size:11px}
    @media(max-width:800px){.detail{grid-template-columns:1fr}.product-page{padding:40px 22px 70px}.detail-copy h1{font-size:48px}}
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="/"><span class="brand-mark">✿</span><span><b>Ромашка</b><small>flowers & studio</small></span></a>
    <a class="header-phone" href="/">← Вернуться в каталог</a>
  </header>
  <main class="product-page">
    <a class="back" href="/">← Все букеты</a>
    <div id="detail"><div class="loading">Открываем букет...</div></div>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const money = n => Number(n || 0).toLocaleString('ru-RU') + ' сомони';
    const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    async function init(){
      const [cr,pr] = await Promise.all([fetch('/api/config'),fetch('/api/products')]);
      const config=await cr.json(), products=await pr.json();
      const p=products.find(x=>String(x.id)===String(id));
      if(!p){document.querySelector('#detail').innerHTML='<div class="loading">Букет не найден.</div>';return;}
      document.title=p.name+' — Ромашка';
      const text='Здравствуйте! 🌸\\nХочу заказать букет «'+p.name+'».\\nЦена: '+money(p.price)+'.\\nПодскажите, пожалуйста, как оформить заказ?';
      const wa='https://wa.me/'+config.whatsapp+'?text='+encodeURIComponent(text);
      document.querySelector('#detail').innerHTML=`
        <div class="detail">
          <div class="detail-photo"><img src="${p.image}" alt="${esc(p.name)}"></div>
          <div class="detail-copy">
            <span class="eyebrow">${esc(p.category)}</span>
            <h1>${esc(p.name)}</h1>
            <div class="detail-price">${money(p.price)}</div>
            <p class="detail-description">${esc(p.description)}</p>
            <div class="detail-meta">
              <div class="meta"><span>Состав</span><b>${esc(p.composition || 'Уточняйте при заказе')}</b></div>
              <div class="meta"><span>Размер</span><b>${esc(p.size || 'Индивидуально')}</b></div>
            </div>
            <div class="order">
              <a class="btn btn-dark" href="${wa}" target="_blank" rel="noopener">Заказать в WhatsApp ↗</a>
              <a class="btn btn-light" href="tel:+${config.whatsapp}">Позвонить</a>
            </div>
            <div class="detail-note">${p.available ? '● Букет доступен для заказа' : '○ Сейчас нет в наличии'}</div>
          </div>
        </div>`;
    }
    init();
  </script>
</body>
</html>
