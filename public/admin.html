<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Админ — Ромашка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#182019;--muted:#737b72;--cream:#f6f4ee;--paper:#fffdf8;--line:#dedfd8;--green:#7e966e;--red:#a55353}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}
    .login{min-height:100vh;display:grid;place-items:center;padding:25px}.login-card{width:min(430px,100%);background:var(--paper);padding:45px;box-shadow:0 30px 80px #18201912}
    .logo{font-family:'Playfair Display';font-size:35px;margin-bottom:8px}.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
    label{display:block;font-size:11px;font-weight:700;margin:16px 0 7px}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;padding:13px 14px;outline:none}textarea{min-height:100px;resize:vertical}
    input:focus,textarea:focus,select:focus{border-color:#87977d}.btn{border:0;background:var(--ink);color:white;padding:13px 18px;cursor:pointer;font-weight:700}.btn.light{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}
    .login .btn{width:100%;margin-top:20px}.error{color:var(--red);font-size:12px;margin-top:12px}
    .app{display:none}.top{height:75px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 4vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.top strong{font-family:'Playfair Display';font-size:24px}.top small{color:var(--muted);margin-left:12px}
    .wrap{width:min(1250px,92vw);margin:40px auto}.title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.title h1{font-family:'Playfair Display';font-size:46px;font-weight:500;margin:5px 0}.title p{color:var(--muted);font-size:12px}
    .panel{background:var(--paper);border:1px solid var(--line);padding:25px;margin-bottom:25px}.panel h2{font-family:'Playfair Display';font-size:27px;font-weight:500;margin:0 0 20px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.full{grid-column:1/-1}.form-actions{display:flex;gap:10px;margin-top:18px}
    .products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.item{background:#fff;border:1px solid var(--line)}.item img{width:100%;height:210px;object-fit:cover}.item-body{padding:17px}.item h3{font-family:'Playfair Display';font-size:21px;margin:0 0 5px}.item .meta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.item .desc{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0;height:36px;overflow:hidden}.item-foot{display:flex;justify-content:space-between;align-items:center}.item-foot b{font-size:14px}.actions{display:flex;gap:7px;margin-top:14px}.actions button{flex:1;padding:9px;border:1px solid var(--line);background:white;cursor:pointer;font-size:11px}.actions .delete{color:var(--red)}
    .status{font-size:10px;padding:5px 8px;background:#e2ecdD;display:inline-block}.status.off{background:#eee;color:#777}
    @media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.title{display:block}.title h1{font-size:38px}.top small{display:none}}
    @media(max-width:560px){.products{grid-template-columns:1fr}.wrap{width:calc(100% - 30px)}.panel{padding:18px}.top{padding:0 15px}}
  </style>
</head>
<body>
  <section class="login" id="login">
    <div class="login-card">
      <div class="logo">Ромашка</div>
      <div class="sub">Панель управления магазином</div>
      <label>Логин</label><input id="username" autocomplete="username" value="admin">
      <label>Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="Введите пароль">
      <button class="btn" onclick="login()">Войти в панель</button>
      <div class="error" id="loginError"></div>
    </div>
  </section>

  <section class="app" id="app">
    <header class="top"><div><strong>Ромашка</strong><small>Admin Panel</small></div><div><a class="btn light" href="/" style="margin-right:8px">Открыть сайт</a><button class="btn light" onclick="logout()">Выйти</button></div></header>
    <main class="wrap">
      <div class="title"><div><span style="font-size:10px;letter-spacing:.2em;color:#7d8878">CATALOG MANAGEMENT</span><h1>Товары</h1><p>Добавляйте букеты, меняйте цены и управляйте наличием.</p></div></div>

      <section class="panel">
        <h2 id="formTitle">Добавить новый букет</h2>
        <form id="productForm">
          <input type="hidden" id="editId">
          <div class="form-grid">
            <div><label>Название</label><input id="name" required placeholder="Например: Нежная ромашка"></div>
            <div><label>Категория</label><select id="category"><option>Букеты</option><option>Ромашки</option><option>Розы</option><option>Композиции</option><option>Подарки</option></select></div>
            <div><label>Цена, сомони</label><input id="price" type="number" min="0" required placeholder="250"></div>
            <div><label>Размер</label><input id="size" placeholder="Средний"></div>
            <div class="full"><label>Описание</label><textarea id="description" placeholder="Красивое описание букета..."></textarea></div>
            <div><label>Состав</label><input id="composition" placeholder="Розы, зелень, упаковка"></div>
            <div><label>Фотография</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"></div>
            <div><label>Или URL фотографии</label><input id="imageUrl" placeholder="https://..."></div>
            <div><label>Наличие</label><select id="available"><option value="true">В наличии</option><option value="false">Нет в наличии</option></select></div>
          </div>
          <div class="form-actions"><button class="btn" type="submit">Сохранить букет</button><button class="btn light" type="button" onclick="resetForm()">Очистить</button></div>
          <div class="error" id="formError"></div>
        </form>
      </section>

      <section class="panel">
        <h2>Все букеты</h2>
        <div class="products" id="products"></div>
      </section>
    </main>
  </section>

<script>
let token = sessionStorage.getItem('romashka_admin_token') || '';
let products = [];

const $ = id => document.getElementById(id);

function login(){
  const u=$('username').value.trim(), p=$('password').value;
  token='Basic '+btoa(unescape(encodeURIComponent(u+':'+p)));
  fetch('/api/products',{headers:{Authorization:token}}).then(r=>{
    if(!r.ok) throw new Error('Неверный логин или пароль');
    sessionStorage.setItem('romashka_admin_token',token);
    showApp(); loadProducts();
  }).catch(e=>{token='';$('loginError').textContent=e.message});
}

function showApp(){ $('login').style.display='none'; $('app').style.display='block'; }
function logout(){ sessionStorage.removeItem('romashka_admin_token'); location.reload(); }

async function loadProducts(){
  const r=await fetch('/api/products'); products=await r.json(); render();
}

function money(n){return Number(n||0).toLocaleString('ru-RU')+' сомони';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

function render(){
  $('products').innerHTML=products.map(p=>`
    <article class="item">
      <img src="${p.image}" alt="${esc(p.name)}">
      <div class="item-body">
        <span class="status ${p.available?'':'off'}">${p.available?'В наличии':'Нет в наличии'}</span>
        <h3>${esc(p.name)}</h3>
        <div class="meta">${esc(p.category)} · ${esc(p.size||'')}</div>
        <div class="desc">${esc(p.description)}</div>
        <div class="item-foot"><b>${money(p.price)}</b><span style="font-size:10px;color:#888">${p.id}</span></div>
        <div class="actions">
          <button onclick="editProduct(${p.id})">Изменить</button>
          <button class="delete" onclick="deleteProduct(${p.id})">Удалить</button>
        </div>
      </div>
    </article>`).join('');
}

function editProduct(id){
  const p=products.find(x=>x.id===id); if(!p)return;
  $('editId').value=p.id; $('name').value=p.name; $('category').value=p.category; $('price').value=p.price;
  $('size').value=p.size||''; $('description').value=p.description||''; $('composition').value=p.composition||'';
  $('available').value=String(p.available); $('imageUrl').value=p.image && p.image.startsWith('http')?p.image:'';
  $('formTitle').textContent='Редактировать: '+p.name; window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  $('productForm').reset(); $('editId').value=''; $('formTitle').textContent='Добавить новый букет'; $('formError').textContent='';
}

$('productForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('formError').textContent='';
  const id=$('editId').value;
  const fd=new FormData();
  fd.append('name',$('name').value);
  fd.append('category',$('category').value);
  fd.append('price',$('price').value);
  fd.append('size',$('size').value);
  fd.append('description',$('description').value);
  fd.append('composition',$('composition').value);
  fd.append('available',$('available').value);
  if($('image').files[0]) fd.append('image',$('image').files[0]);
  else if($('imageUrl').value) fd.append('image',$('imageUrl').value);

  const url=id?'/api/products/'+id:'/api/products';
  const method=id?'PUT':'POST';
  try{
    const r=await fetch(url,{method,headers:{Authorization:token},body:fd});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Ошибка');
    resetForm(); await loadProducts();
  }catch(err){$('formError').textContent=err.message}
});

async function deleteProduct(id){
  if(!confirm('Удалить этот букет?'))return;
  const r=await fetch('/api/products/'+id,{method:'DELETE',headers:{Authorization:token}});
  if(r.status===401){logout();return}
  if(!r.ok){const d=await r.json();alert(d.error||'Ошибка');return}
  loadProducts();
}

if(token){
  fetch('/api/products',{headers:{Authorization:token}}).then(r=>{
    if(r.ok){showApp();loadProducts();}else{token='';sessionStorage.removeItem('romashka_admin_token');}
  });
}
</script>
</body>
</html>
